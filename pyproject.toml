[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seventhings-customer-api"
dynamic = ["version"]
description = "Python client for the seventhings Customer API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "seventhings GmbH" }]
dependencies = ["httpx>=0.27,<1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]

[project.urls]
Repository = "https://github.com/SeventhingsCompany/customer-api-python"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.hatch.version]
path = "src/seventhings/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/seventhings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: live tests against a seventhings instance (need SEVENTHINGS_* env vars)"]
addopts = "-m 'not integration'"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "examples", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Generated from _async/client.py; async-for loops become plain for-yield loops.
"src/seventhings/_sync/*" = ["UP028", "I001"]
