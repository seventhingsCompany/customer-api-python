[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seventhings-customer-api"
dynamic = ["version"]
description = "Python client for the seventhings Customer API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "seventhings GmbH" }]
keywords = ["seventhings", "asset management", "inventory", "api", "sdk", "client"]
dependencies = ["httpx>=0.27,<1"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]

[project.urls]
Documentation = "https://api.seventhings.com/guides/sdks/python/"
Repository = "https://github.com/seventhingsCompany/customer-api-python"
Issues = "https://github.com/seventhingsCompany/customer-api-python/issues"
Changelog = "https://github.com/seventhingsCompany/customer-api-python/releases"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.hatch.version]
path = "src/seventhings/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/seventhings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: live tests against a seventhings instance (need SEVENTHINGS_* env vars)"]
addopts = "-m 'not integration'"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "examples", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Generated from _async/client.py; async-for loops become plain for-yield loops.
"src/seventhings/_sync/*" = ["UP028", "I001"]
